name: Build TraderMind Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build TraderMind
        working-directory: artifacts/tradermind
        run: pnpm build
        env:
          PORT: "23583"
          BASE_PATH: "/"

      - name: Capacitor Sync
        working-directory: artifacts/tradermind
        run: npx cap sync android

      - name: Build APK
        working-directory: artifacts/tradermind/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TraderMind-debug-apk
          path: artifacts/tradermind/android/app/build/outputs/apk/debug/app-debug.apk
