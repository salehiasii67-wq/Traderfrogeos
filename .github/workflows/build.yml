concurrency: name: Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --shamefully-hoist --ignore-scripts=false

      - name: Approve build scripts
        run: pnpm approve-builds

      - name: Rebuild esbuild
        run: pnpm rebuild esbuild

      - name: Build Vite
        run: pnpm run build

      - name: Build Electron
        run: pnpm electron:build

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: TraderMind-Windows
          path: |
            dist/**
            release/**
