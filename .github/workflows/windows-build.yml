name: Build TraderMind Windows

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm rebuild

      - name: Build Windows App
        working-directory: artifacts/tradermind
        run: pnpm electron:build
        env:
          PORT: "23583"
          BASE_PATH: "/"

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: TraderMind-Windows
          path: artifacts/tradermind/release/*
