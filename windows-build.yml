name: Build TraderForge Windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Windows App
        working-directory: artifacts/tradermind
        run: npm run electron:build
        env:
          PORT: "5173"
          BASE_PATH: "/"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TraderForge-Windows
          path: artifacts/tradermind/release/**
